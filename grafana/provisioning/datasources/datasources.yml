apiVersion: 1

datasources:
  - name: Neo4j
    type: kniepdennis-neo4j-datasource
    access: proxy
    url: bolt://neo4j:7687
    jsonData:
      database: ${NEO4J_DB:-neo4j}
    secureJsonData:
      password: ${NEO4J_PASSWORD:-password}

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${POSTGRES_DB:-grafana}
    user: ${POSTGRES_USER:-grafana}
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-grafana}
    jsonData:
      sslmode: disable
    isDefault: true
